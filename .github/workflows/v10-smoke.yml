name: substrate-v10-smoke

on:
  push:
    branches: [ main ]
    paths:
      - 'v10/**'
      - 'v9/**'
      - 'v8/**'
      - 'v7/**'
      - 'v6/**'
      - 'v5/**'
      - 'v4/**'
      - 'v3/**'
      - 'v2/**'
      - '.github/workflows/v10-smoke.yml'
  pull_request:
    paths:
      - 'v10/**'
      - 'v9/**'
      - 'v8/**'
      - 'v7/**'
      - 'v6/**'
      - 'v5/**'
      - 'v4/**'
      - 'v3/**'
      - 'v2/**'
      - '.github/workflows/v10-smoke.yml'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Smoke test
        run: |
          python smoke_test_ci.py
        env:
          PYTHONPATH: "${{ github.workspace }}"

      - name: Circuit breaker test
        run: |
          python run_circuit_breaker_demo.py
        env:
          PYTHONPATH: "${{ github.workspace }}"
