<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .box-sources { fill: #1a2332; stroke: #58a6ff; stroke-width: 2; }
      .box-structured { fill: #1a2332; stroke: #3fb950; stroke-width: 2; }
      .box-wiki { fill: #1a2332; stroke: #d29922; stroke-width: 2; }
      .box-search { fill: #1a2332; stroke: #bc8cff; stroke-width: 2; }
      .box-system { fill: #1a2332; stroke: #f78166; stroke-width: 2; }
      .arrow { stroke: #8b949e; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .bidirectional { stroke: #8b949e; stroke-width: 1.5; fill: none; stroke-dasharray: 5,3; }
      .label-title { font-family: sans-serif; font-size: 13px; font-weight: bold; fill: #c9d1d9; }
      .label-sub { font-family: sans-serif; font-size: 11px; fill: #8b949e; }
      .label-layer { font-family: sans-serif; font-size: 10px; fill: #6e7681; }
      .label-tag { font-family: monospace; font-size: 9px; fill: #8b949e; }
      .title-main { font-family: sans-serif; font-size: 22px; font-weight: bold; fill: #c9d1d9; }
      .title-sub { font-family: sans-serif; font-size: 13px; fill: #8b949e; }
      .highlight { fill: #388bfd; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" width="900" height="680"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" class="title-main">Hybrid Memory System</text>
  <text x="450" y="60" text-anchor="middle" class="title-sub">Architecture Overview</text>

  <!-- Sources Layer -->
  <rect class="box-sources" x="30" y="95" width="195" height="260" rx="8"/>
  <text x="127" y="125" text-anchor="middle" class="label-title" fill="#58a6ff">sources/</text>
  <text x="127" y="143" text-anchor="middle" class="label-sub">Raw Evidence</text>
  <rect fill="#161b22" x="45" y="155" width="165" height="30" rx="4"/>
  <text x="127" y="174" text-anchor="middle" class="label-tag">YYYY-MM-DD-topic.ext</text>
  <rect fill="#161b22" x="45" y="192" width="165" height="30" rx="4"/>
  <text x="127" y="211" text-anchor="middle" class="label-tag">transcripts / logs</text>
  <rect fill="#161b22" x="45" y="229" width="165" height="30" rx="4"/>
  <text x="127" y="248" text-anchor="middle" class="label-tag">imported docs</text>
  <rect fill="#161b22" x="45" y="266" width="165" height="30" rx="4"/>
  <text x="127" y="285" text-anchor="middle" class="label-tag">screenshots / files</text>
  <text x="127" y="330" text-anchor="middle" class="label-layer">immutable · never rewritten</text>

  <!-- Structured Layer -->
  <rect class="box-structured" x="270" y="95" width="195" height="260" rx="8"/>
  <text x="367" y="125" text-anchor="middle" class="label-title" fill="#3fb950">structured/</text>
  <text x="367" y="143" text-anchor="middle" class="label-sub">Canonical Facts &amp; State</text>
  <rect fill="#161b22" x="285" y="155" width="165" height="30" rx="4"/>
  <text x="367" y="174" text-anchor="middle" class="label-tag">people/</text>
  <rect fill="#161b22" x="285" y="192" width="165" height="30" rx="4"/>
  <text x="367" y="211" text-anchor="middle" class="label-tag">decisions/</text>
  <rect fill="#161b22" x="285" y="229" width="165" height="30" rx="4"/>
  <text x="367" y="248" text-anchor="middle" class="label-tag">projects/</text>
  <rect fill="#161b22" x="285" y="266" width="165" height="30" rx="4"/>
  <text x="367" y="285" text-anchor="middle" class="label-tag">systems/ tasks/ timelines/</text>
  <text x="367" y="330" text-anchor="middle" class="label-layer">durable · evidence-backed</text>

  <!-- Wiki Layer -->
  <rect class="box-wiki" x="510" y="95" width="195" height="260" rx="8"/>
  <text x="607" y="125" text-anchor="middle" class="label-title" fill="#d29922">wiki/</text>
  <text x="607" y="143" text-anchor="middle" class="label-sub">Synthesis &amp; Reusable Knowledge</text>
  <rect fill="#161b22" x="525" y="155" width="165" height="30" rx="4"/>
  <text x="607" y="174" text-anchor="middle" class="label-tag">systems/</text>
  <rect fill="#161b22" x="525" y="192" width="165" height="30" rx="4"/>
  <text x="607" y="211" text-anchor="middle" class="label-tag">workflows/</text>
  <rect fill="#161b22" x="525" y="229" width="165" height="30" rx="4"/>
  <text x="607" y="248" text-anchor="middle" class="label-tag">comparisons/</text>
  <rect fill="#161b22" x="525" y="266" width="165" height="30" rx="4"/>
  <text x="607" y="285" text-anchor="middle" class="label-tag">projects/ concepts/</text>
  <text x="607" y="330" text-anchor="middle" class="label-layer">synthetic · linked · readable</text>

  <!-- Search Layer -->
  <rect class="box-search" x="750" y="95" width="120" height="150" rx="8"/>
  <text x="810" y="125" text-anchor="middle" class="label-title" fill="#bc8cff">search/</text>
  <text x="810" y="143" text-anchor="middle" class="label-sub">Retrieval Support</text>
  <rect fill="#161b22" x="760" y="155" width="100" height="25" rx="4"/>
  <text x="810" y="172" text-anchor="middle" class="label-tag">manifests/</text>
  <rect fill="#161b22" x="760" y="187" width="100" height="25" rx="4"/>
  <text x="810" y="204" text-anchor="middle" class="label-tag">catalogs/</text>
  <text x="810" y="230" text-anchor="middle" class="label-layer">rebuildable</text>

  <!-- Discipline Box -->
  <rect class="box-system" x="270" y="395" width="330" height="120" rx="8"/>
  <text x="435" y="420" text-anchor="middle" class="label-title" fill="#f78166">Promotion Discipline</text>
  <text x="435" y="443" text-anchor="middle" class="label-sub">fact → structured | synthesis → wiki | evidence → sources</text>
  <line x1="310" y1="455" x2="560" y2="455" stroke="#30363d" stroke-width="1"/>
  <text x="320" y="475" class="label-tag" fill="#8b949e">promotion-rule</text>
  <text x="320" y="493" class="label-tag" fill="#8b949e">review-cycle</text>
  <text x="510" y="475" class="label-tag" fill="#8b949e">lint-rules</text>
  <text x="510" y="493" class="label-tag" fill="#8b949e">quality-standards</text>

  <!-- Maintenance Box -->
  <rect class="box-system" x="30" y="395" width="200" height="120" rx="8"/>
  <text x="130" y="420" text-anchor="middle" class="label-title" fill="#f78166">Maintenance</text>
  <text x="130" y="440" text-anchor="middle" class="label-sub">OpenClaw Agent</text>
  <text x="50" y="460" class="label-tag">· read · write · promote</text>
  <text x="50" y="478" class="label-tag">· review · query · extract</text>
  <text x="50" y="496" class="label-tag">· validate · update · archive</text>

  <!-- External Systems -->
  <rect class="box-system" x="630" y="395" width="240" height="120" rx="8"/>
  <text x="750" y="420" text-anchor="middle" class="label-title" fill="#f78166">External Systems</text>
  <text x="645" y="443" class="label-tag" fill="#8b949e">Apollo WorkOS · Hermes</text>
  <text x="645" y="460" class="label-tag" fill="#8b949e">OpenClaw · agent workspace</text>
  <text x="645" y="477" class="label-tag" fill="#8b949e">external sources · feeds</text>
  <text x="645" y="494" class="label-tag" fill="#58a6ff">→ selective ingestion only</text>

  <!-- Arrows: Sources → Structured -->
  <path d="M225 225 L260 225" class="arrow" marker-end="url(#arrow-blue)"/>
  <text x="238" y="215" text-anchor="middle" class="label-layer" fill="#58a6ff">promote fact</text>

  <!-- Arrows: Structured → Wiki -->
  <path d="M465 225 L500 225" class="arrow"/>
  <text x="478" y="215" text-anchor="middle" class="label-layer">promote synthesis</text>

  <!-- Arrows: Wiki → Search feedback -->
  <path d="M705 225 L740 225" class="bidirectional"/>
  <text x="720" y="215" text-anchor="middle" class="label-layer">index</text>

  <!-- Promotion to Maintenance -->
  <path d="M365 355 L130 395" class="arrow" stroke-dasharray="4,2"/>
  <path d="M435 355 L435 395" class="arrow"/>

  <!-- Maintenance → Discipline -->
  <path d="M130 395 L350 400" class="arrow"/>
  <path d="M230 395 L350 400" class="arrow"/>

  <!-- External → Sources ingestion -->
  <path d="M630 395 L225 355" class="arrow" stroke-dasharray="4,2"/>
  <text x="430" y="368" text-anchor="middle" class="label-layer" fill="#8b949e">source evidence</text>

  <!-- Boundary note -->
  <line x1="30" y1="530" x2="870" y2="530" stroke="#30363d" stroke-width="1"/>
  <text x="450" y="550" text-anchor="middle" class="label-layer">public package: hybrid-memory-system · live adoption: knowledge-system/</text>
  <text x="450" y="568" text-anchor="middle" class="label-layer">hermes overlays deferred · OpenClaw as primary global knowledge plane</text>

</svg>
