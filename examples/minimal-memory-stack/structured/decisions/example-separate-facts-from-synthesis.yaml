summary: >
  Facts should live in structured records while synthesis should live in wiki pages.
decision: >
  Use structured records for stable facts and wiki pages for reusable reasoning.
rationale: >
  This reduces ambiguity and repeated re-derivation.
impact:
  - retrieval
  - maintainability
